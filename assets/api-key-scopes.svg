<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-labelledby="t d">
  <title id="t">One API key, only the scopes it needs</title>
  <desc id="d">An example key for a conversion script has convert:read and convert:write ticked, so it can start, follow and download jobs. Without carnet and social scopes, the notebook and profile endpoints answer 403 insufficient-scope.</desc>
  <defs>
    <style>
      .sans { font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 2 9; stroke-linecap: round; animation: dash 1.3s linear infinite; }
      .tick { stroke-dasharray: 30; stroke-dashoffset: 0; animation: tick 6s ease-out infinite; }
      .tick2 { animation-delay: 0.35s; }
      .wave { animation: wave 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes tick { 0%, 80% { stroke-dashoffset: 0; } 82%, 86% { stroke-dashoffset: 30; } 96%, 100% { stroke-dashoffset: 0; } }
      @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-6deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <pattern id="ruled" width="1280" height="34" patternUnits="userSpaceOnUse" y="20">
      <rect x="0" y="33" width="1280" height="1" fill="#E4DCCA"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="600" rx="28"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5C7B5C"/>
    </marker>
    <g id="shroom" stroke="#2D2620" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M19 31C17 43 18 52 23 55H37C42 52 43 43 41 31Z" fill="#FBF7EE"/>
      <path d="M4 31C3 9 57 9 56 31C46 35 14 35 4 31Z" fill="#C73E3F"/>
      <g stroke="none" fill="#FFFFFF">
        <ellipse cx="18" cy="21" rx="4.5" ry="3.8"/>
        <ellipse cx="33" cy="15" rx="4.5" ry="3.4"/>
        <ellipse cx="46" cy="24" rx="3.6" ry="3.2"/>
        <circle cx="29" cy="27" r="2.2"/>
      </g>
      <g stroke="none">
        <circle cx="26" cy="41" r="2" fill="#2D2620"/>
        <circle cx="34" cy="41" r="2" fill="#2D2620"/>
        <circle cx="22.5" cy="45" r="2.2" fill="#E8838A"/>
        <circle cx="37.5" cy="45" r="2.2" fill="#E8838A"/>
      </g>
      <path d="M27.5 45.5Q30 48 32.5 45.5" fill="none" stroke-width="2"/>
    </g>
    <g id="lock" fill="none" stroke="#C73E3F" stroke-width="2.6" stroke-linejoin="round">
      <path d="M5 11V7A6 6 0 0 1 17 7V11" stroke-linecap="round"/>
      <rect x="1" y="11" width="20" height="14" rx="3" fill="#C73E3F"/>
    </g>
    <g id="box-on">
      <rect width="24" height="24" rx="6" fill="#5C7B5C" stroke="#2D2620" stroke-width="2"/>
    </g>
    <g id="box-off">
      <rect width="24" height="24" rx="6" fill="#FBF7EE" stroke="#8A8074" stroke-width="2"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="600" fill="#F5F0E6"/>
    <rect width="1280" height="600" fill="url(#ruled)"/>
    <rect x="30" y="0" width="2" height="600" fill="#C73E3F" opacity="0.35"/>
  </g>
  <rect x="1" y="1" width="1278" height="598" rx="27" fill="none" stroke="#D9D0BC" stroke-width="2"/>

  <g class="sans">
    <text x="56" y="70" font-size="34" font-weight="800" fill="#2D2620">One key, only the scopes it needs</text>
    <text x="56" y="106" font-size="20" fill="#5C544A">You tick scopes when you create a key. It cannot be widened later: create another one, revoke the old one.</text>
  </g>

  <!-- Key card -->
  <g transform="translate(56 146)">
    <rect x="4" y="6" width="400" height="372" rx="16" fill="#2D2620" opacity="0.08"/>
    <rect width="400" height="372" rx="16" fill="#FBF7EE" stroke="#2D2620" stroke-width="2.5"/>
    <text x="22" y="40" class="sans" font-size="15" fill="#8A8074">Example: a key for a conversion script</text>
    <rect x="22" y="56" width="356" height="44" rx="10" fill="#EBE4D4"/>
    <text x="38" y="84" class="mono" font-size="17" fill="#2D2620">jj_live_<tspan fill="#8A8074">••••••••••••</tspan></text>
    <text x="364" y="84" class="sans" font-size="14" fill="#C2611F" font-weight="700" text-anchor="end">shown once</text>

    <g class="mono" font-size="18">
      <g transform="translate(22 124)">
        <use href="#box-on"/><path class="tick" d="M6 12.5L10.5 17L18.5 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="18" fill="#2D2620" font-weight="700">convert:read</text>
      </g>
      <g transform="translate(22 166)">
        <use href="#box-on"/><path class="tick tick2" d="M6 12.5L10.5 17L18.5 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="18" fill="#2D2620" font-weight="700">convert:write</text>
      </g>
      <g transform="translate(22 208)">
        <use href="#box-off"/><text x="40" y="18" fill="#8A8074">carnet:read</text>
      </g>
      <g transform="translate(22 250)">
        <use href="#box-off"/><text x="40" y="18" fill="#8A8074">carnet:write</text>
      </g>
      <g transform="translate(22 292)">
        <use href="#box-off"/><text x="40" y="18" fill="#8A8074">social:read</text>
      </g>
    </g>
    <rect x="22" y="330" width="356" height="1.5" fill="#D9D0BC"/>
    <text x="22" y="356" class="sans" font-size="14" fill="#8A8074">Also: <tspan class="mono">stems:write</tspan>, <tspan class="mono">audio:write</tspan>, <tspan class="mono">queue:read</tspan></text>
    <g transform="translate(330 -40)"><g class="wave"><use href="#shroom" transform="scale(1.05)"/></g></g>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke-width="2.5">
    <path class="flow" d="M458 282C500 282 500 224 552 224" stroke="#5C7B5C" marker-end="url(#arrow)"/>
    <path class="flow" d="M458 324C504 324 500 236 552 232" stroke="#5C7B5C"/>
    <path d="M458 366C500 366 500 372 552 372" stroke="#C9BFAC" stroke-dasharray="6 7"/>
    <path d="M458 408C500 408 500 382 552 378" stroke="#C9BFAC" stroke-dasharray="6 7"/>
    <path d="M458 450C500 450 500 490 552 490" stroke="#C9BFAC" stroke-dasharray="6 7"/>
  </g>

  <!-- Convert: allowed -->
  <g transform="translate(560 146)">
    <rect width="664" height="156" rx="16" fill="#FBF7EE" stroke="#5C7B5C" stroke-width="2.5"/>
    <text x="24" y="42" class="sans" font-size="22" font-weight="800" fill="#2D2620">Convert</text>
    <rect x="132" y="20" width="96" height="30" rx="15" fill="#4DAA75"/>
    <text x="180" y="41" class="mono" font-size="15" font-weight="700" fill="#2D2620" text-anchor="middle">allowed</text>
    <g class="mono" font-size="15">
      <text x="24" y="140"><tspan fill="#5C7B5C" font-weight="700">convert:write</tspan><tspan x="164" fill="#2D2620">POST /jobs · DELETE /jobs/{id}</tspan></text>
      <text x="24" y="84"><tspan fill="#5C7B5C" font-weight="700">convert:read</tspan><tspan x="164" fill="#2D2620">GET /jobs/{id} · /events · /result*</tspan></text>
      <text x="24" y="112"><tspan x="164" fill="#2D2620">GET /me/usage</tspan><tspan fill="#8A8074">  quota and scopes of the key</tspan></text>
    </g>
  </g>

  <!-- Notebook: refused -->
  <g transform="translate(560 318)">
    <rect width="664" height="118" rx="16" fill="#EBE4D4" stroke="#D9D0BC" stroke-width="2"/>
    <text x="24" y="40" class="sans" font-size="22" font-weight="800" fill="#5C544A">Notebook <tspan font-size="16" font-weight="600" fill="#8A8074">private songs and playlists</tspan></text>
    <use href="#lock" x="414" y="18"/>
    <rect x="446" y="18" width="198" height="30" rx="8" fill="#C73E3F"/>
    <text x="545" y="39" class="mono" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">403 insufficient-scope</text>
    <g class="mono" font-size="15" fill="#5C544A">
      <text x="24" y="78"><tspan font-weight="700">carnet:read</tspan><tspan x="164">GET /me/songs* · /me/playlists*</tspan></text>
      <text x="24" y="104"><tspan font-weight="700">carnet:write</tspan><tspan x="164">POST/PUT/PATCH/DELETE, same paths</tspan></text>
    </g>
  </g>

  <!-- Social: refused -->
  <g transform="translate(560 452)">
    <rect width="664" height="80" rx="16" fill="#EBE4D4" stroke="#D9D0BC" stroke-width="2"/>
    <text x="24" y="38" class="sans" font-size="22" font-weight="800" fill="#5C544A">Social <tspan font-size="16" font-weight="600" fill="#8A8074">read only</tspan></text>
    <use href="#lock" x="414" y="16"/>
    <rect x="446" y="16" width="198" height="30" rx="8" fill="#C73E3F"/>
    <text x="545" y="37" class="mono" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">403 insufficient-scope</text>
    <g class="mono" font-size="15" fill="#5C544A">
      <text x="24" y="66"><tspan font-weight="700">social:read</tspan><tspan x="164">GET /users/{handle}* · /me/followers · /me/following</tspan></text>
    </g>
  </g>

  <!-- Footer -->
  <g class="sans" font-size="16" fill="#5C544A">
    <text x="56" y="572">Give an integration only what it needs: converting is <tspan class="mono" fill="#2D2620">convert:read</tspan> + <tspan class="mono" fill="#2D2620">convert:write</tspan>; filing results in your notebook adds <tspan class="mono" fill="#2D2620">carnet:write</tspan>.</text>
  </g>
</svg>
